name: m3-14-convergence-scale
on:
  pull_request:
    paths:
      - '**/scale_screen.py'
      - '**/*m3_14*'
      - '.github/workflows/m3-14-convergence-scale.yml'
  workflow_dispatch:
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[physics,test]"
      - run: python -m pytest tests/test_m3_14_scale_screen.py -q
      - run: python scripts/run_m3_14_convergence_scale.py
      - uses: actions/upload-artifact@v4
        with:
          name: m3-14-convergence-scale
          path: results/m3_14_convergence_scale.json
