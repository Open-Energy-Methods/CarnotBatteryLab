name: m3-synthetic-bidirectional-tes
on:
  push:
    paths:
      - 'src/carnot_battery_lab/physics/reverse_flow_discharge.py'
      - 'scripts/run_m3_synthetic_cycles.py'
      - 'tests/test_m3_reverse_flow_discharge.py'
      - '.github/workflows/m3-synthetic-bidirectional-tes.yml'
  workflow_dispatch:
jobs:
  synthetic-charge-and-reverse-discharge:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install physics and test dependencies
        run: python -m pip install -e ".[physics,test]"
      - name: Verify reverse orientation, process service grade, exergy and full-cycle first-law
        run: python -m pytest tests/test_m3_reverse_flow_discharge.py -v
      - name: Produce source-controlled synthetic 3-cycle charge/discharge audit
        run: python scripts/run_m3_synthetic_cycles.py --output results/m3_synthetic_charge_reverse_discharge.json
      - uses: actions/upload-artifact@v4
        with:
          name: m3-unvalidated-bidirectional-thermal-cycle
          path: results/m3_synthetic_charge_reverse_discharge.json
          if-no-files-found: error
          retention-days: 21
