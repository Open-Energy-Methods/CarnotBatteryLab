name: m3-8-terminal-control-and-real-air-volume
on:
  push:
    branches: [main, feat/m3-8-terminal-control-and-compressible-cell]
  pull_request:
    paths:
      - 'src/carnot_battery_lab/physics/process_gas_bypass_control.py'
      - 'src/carnot_battery_lab/physics/real_air_control_volume.py'
      - 'scripts/run_m3_8_terminal_control_and_air_volume.py'
      - 'tests/test_m3_8_terminal_and_real_air.py'
      - '.github/workflows/m3-8-terminal-control-and-real-air-volume.yml'
  workflow_dispatch:
jobs:
  control-and-conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[physics,test]"
      - run: python -m pytest tests/test_m3_8_terminal_and_real_air.py tests/test_m3_7_bypass_and_air_eos.py tests/test_m3_6_transient_liquid_hx.py -q
      - run: python scripts/run_m3_8_terminal_control_and_air_volume.py
      - name: Verify unchanged service and explicit experimental blockers
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          r=json.loads(Path("results/m3_8_control_and_real_air.json").read_text())
          assert r["original_contract"]=="1MW_110_to_150C_water"
          assert not r["actual_process_water_delivery_qualified"]
          assert not r["experimental_validation_completed"]
          assert not r["fully_coupled_variable_property_bed_HX_implemented"]
          assert r["Carnot_battery_RTE"] is None
          assert len(r["results"])==6
          for v in r["results"].values():
              s=v["summary"]
              assert not s["physical_service_qualified"]
              assert 0<=s["consecutive_passing_service_minutes"]<=60
              assert s["max_abs_valve_mass_residual_kg_s"]<1e-9
              assert abs(s["combined_first_law_residual_J"])<5000
          for v in r["real_air_control_volume_tests"].values():
              assert abs(v["mass_balance_residual_kg"])<1e-8
              assert abs(v["energy_balance_residual_J"])<.1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m3-8-numerical-model-only-control-and-real-air-cell
          path: results/m3_8_control_and_real_air.json
          retention-days: 90
