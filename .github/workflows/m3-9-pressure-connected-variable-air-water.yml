name: m3-9-pressure-connected-variable-air-water
on:
  push:
    paths:
      - 'src/carnot_battery_lab/physics/open_real_air_water_train.py'
      - 'tests/test_m3_9_open_real_air_water_train.py'
      - 'scripts/run_m3_9_open_air_water_train.py'
      - 'docs/methods/M3_9_OPEN_PRESSURE_CONNECTED_BED_HX.md'
      - '.github/workflows/m3-9-pressure-connected-variable-air-water.yml'
  pull_request:
    paths:
      - 'src/carnot_battery_lab/physics/open_real_air_water_train.py'
      - 'tests/test_m3_9_open_real_air_water_train.py'
      - 'scripts/run_m3_9_open_air_water_train.py'
      - 'docs/methods/M3_9_OPEN_PRESSURE_CONNECTED_BED_HX.md'
      - '.github/workflows/m3-9-pressure-connected-variable-air-water.yml'
  workflow_dispatch:
jobs:
  shared-interface-mass-enthalpy-ledgers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[physics,test]"
      - run: python -m pytest tests/test_m3_9_open_real_air_water_train.py tests/test_m3_8_real_air_bed_prototype.py tests/test_m3_8_terminal_and_real_air.py -q
      - run: python scripts/run_m3_9_open_air_water_train.py
      - name: Independently check model-only results and failure controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/m3_9_open_air_water_train.json").read_text())
          assert len(r["results"])==7
          assert not r["gas_closed_circulation_loop_implemented"]
          assert not r["industrial_1MW_qualified"]
          assert r["Carnot_battery_RTE"] is None
          for v in r["results"].values():
              a=v["result"]
              for key in ("bed_mass_residual_kg","HX_mass_residual_kg","whole_train_mass_residual_kg"):
                  assert abs(a[key])<1e-7
              for key in ("bed_energy_residual_J","HX_energy_residual_J","whole_train_energy_residual_J"):
                  assert abs(a[key])<.2
              assert a["gas_EOS_mass_and_energy_coupled_across_bed_HX"]
              assert not a["experimental_validation"]
              assert a["maximum_interstitial_or_HX_Mach_at_accepted_nodes"]<.1
          rows={k:v["summary"] for k,v in r["results"].items()}
          assert rows["higher_hx_resistance"]["bed_HX_shared_interface_mass_kg"]<rows["baseline_4_4"]["bed_HX_shared_interface_mass_kg"]
          assert rows["lower_pressure_head"]["bed_HX_shared_interface_mass_kg"]<rows["baseline_4_4"]["bed_HX_shared_interface_mass_kg"]
          assert abs(rows["cold_bed_control"]["water_mean_thermal_duty_W"])<2.
          print("M3_9_COMPONENT_MASS_ENERGY_AND_BACKPRESSURE_MODEL_ONLY_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m3-9-open-air-water-train-NOT-industrial
          path: results/m3_9_open_air_water_train.json
          retention-days: 90
