name: research-foundation-ci
on:
  push:
  pull_request:
jobs:
  contract-and-primitive-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/ -v
      - run: python -m carnot_battery_lab.cli validate-case cases/reference_industrial_heat_150C.yaml

  r718-realfluid-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,physics]"
      - run: python -m pip install "matplotlib>=3.8"
      - run: python -m pytest tests/test_finite_hx.py tests/test_r718_realfluid.py tests/test_m1_evidence_hydraulics.py tests/test_m2_gas_rock_coupling.py tests/test_r718_injection_reference.py tests/test_r600_transcritical_screen.py tests/test_m2_solid_conduction.py tests/test_flow_pressure_audit.py -v
      - run: python scripts/run_r718_reference.py --output results/r718_h0_reference_screen.json
      - run: python scripts/run_m1_reference_evidence.py --output results/m1_reference_evidence.json
      - run: python scripts/run_m2_coupled_charge.py --output results/m2_charge_only_screen.json
      - run: python scripts/run_r718_injection_design.py --output results/r718_injection_design_reference.json
      - run: python scripts/run_natural_fluid_80c_evidence.py --output results/natural_refrigerant_80C_screen.json
      - run: python scripts/plot_m2_coupled_charge.py --input results/m2_charge_only_screen.json --output-dir results/figures
      - uses: actions/upload-artifact@v4
        with:
          name: r718-unvalidated-reference-screen
          path: |
            results/r718_h0_reference_screen.json
            results/m1_reference_evidence.json
            results/r718_injection_design_reference.json
            results/natural_refrigerant_80C_screen.json
            results/m2_charge_only_screen.json
            results/figures/*.png
