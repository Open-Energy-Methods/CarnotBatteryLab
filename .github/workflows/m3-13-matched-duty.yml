name: m3-13-matched-duty
on:
  pull_request:
    paths:
      - 'src/carnot_battery_lab/physics/closed_real_air_cycle.py'
      - 'tests/test_m3_13_matched_duty.py'
      - 'scripts/run_m3_13_matched_duty.py'
      - 'docs/methods/M3_13_MATCHED_DUTY.md'
      - '.github/workflows/m3-13-matched-duty.yml'
  workflow_dispatch:
jobs:
  model-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[physics,test]"
      - run: python -m pytest tests/test_m3_10_closed_real_air_cycle.py tests/test_m3_11_reverse_flow_recovery.py tests/test_m3_12_periodic_recovery.py tests/test_m3_13_matched_duty.py -q
      - run: python scripts/run_m3_13_matched_duty.py
      - name: Audit service and inventory ledgers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("results/m3_13_matched_duty.json").read_text())
          assert len(x["cases"])==9 and x["Carnot_battery_RTE"] is None and not x["industrial_matched_service"]
          for name,item in x["cases"].items():
              r=item["result"]
              assert len(r["cycle_records"])==10
              assert abs(r["repeated_sequence_mass_residual_kg"])<1e-8
              assert abs(r["repeated_sequence_electrical_residual_J"])<.2
              for p in r["cycle_records"]:
                  d=p["discharge"]
                  assert abs(d["water_throughput_kg"]-d["process_demand_flow_kg_s"]*d["duration_s"])<1e-6
                  assert abs(d["water_boundary_heat_J"]-(d["process_demand_W"]*d["duration_s"]-d["process_duty_deficit_J"]+d["process_duty_excess_J"]))<.2
                  assert 0<=d["simultaneous_target_duration_s"]<=d["duration_s"]
                  assert d["process_duty_deficit_J"]>=-1e-6
                  assert d["simultaneous_target_heat_J"]>=-1e-6
                  if r["process_bypass"]:
                      assert d["process_duty_excess_J"]<1e-6
                  for z in (p["charge"],d):
                      assert max(abs(v) for v in z["component_thermal_residuals_J"].values())<.2
          print("M3_13_ACCOUNTING_PASS_SERVICE_OUTCOMES_REPORTED_SEPARATELY")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m3-13-matched-duty-model-only
          path: results/m3_13_matched_duty.json
          retention-days: 90
