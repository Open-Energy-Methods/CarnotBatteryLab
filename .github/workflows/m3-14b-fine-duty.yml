name: m3-14b-fine-duty
on:
  pull_request:
    paths:
      - 'src/carnot_battery_lab/physics/closed_real_air_cycle.py'
      - 'src/carnot_battery_lab/physics/fine_duty_audit.py'
      - 'scripts/run_m3_14b_fine_duty.py'
      - 'tests/test_m3_14b_fine_duty.py'
      - '.github/workflows/m3-14b-fine-duty.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[physics,test]"
      - run: python -m pytest tests/test_m3_14b_fine_duty.py tests/test_m3_14_scale_screen.py tests/test_m3_13_matched_duty.py -q
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [q500_n12,q500_n16,q1000_n12,q1000_n16,q1250_n12,q1250_n16,q1000_n12_halfstep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[physics,test]"
      - run: python scripts/run_m3_14b_fine_duty.py --case ${{ matrix.case }} --output results/case_${{ matrix.case }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: m314b-${{ matrix.case }}
          path: results/case_${{ matrix.case }}.json
          if-no-files-found: error
  aggregate:
    needs: [unit,case]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[test]"
      - uses: actions/download-artifact@v4
        with:
          pattern: m314b-*
          path: evidence
      - run: python scripts/run_m3_14b_fine_duty.py --aggregate evidence --output results/m3_14b_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: m314b-summary
          path: results/m3_14b_summary.json
          if-no-files-found: error
